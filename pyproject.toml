[project]
name = "simple-snr-calc"
version = "0.1.0"
description = "Signal-to-noise ratio calculator for satellite remote sensing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pydantic>=2.0",
    "click",
    "loguru",
    "astropy",
]

[project.scripts]
simple-snr-calc = "simple_snr_calc.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_snr_calc"]
